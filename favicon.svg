<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07161d" />
      <stop offset="0.52" stop-color="#111128" />
      <stop offset="1" stop-color="#1b0f2a" />
    </linearGradient>
    <linearGradient id="f-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffbe" />
      <stop offset="0.55" stop-color="#e9ecff" />
      <stop offset="1" stop-color="#aa5aff" />
    </linearGradient>
    <filter id="f-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.25" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .spin{transform-origin:32px 32px;animation:fspin 8s linear infinite}
      .pulse{animation:fpulse 2.8s ease-in-out infinite}
      @keyframes fspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes fpulse{0%,100%{opacity:.62}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.spin,.pulse{animation:none}}
    </style>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#f-bg)" />
  <circle class="pulse" cx="32" cy="32" r="20" fill="#00c8ff" fill-opacity="0.14" filter="url(#f-glow)" />
  <g class="spin">
    <ellipse cx="32" cy="32" rx="22" ry="12" fill="none" stroke="url(#f-ring)" stroke-opacity="0.84" stroke-width="2.1" filter="url(#f-glow)" />
  </g>
  <circle cx="32" cy="32" r="9" fill="#e9ecff" fill-opacity="0.16" stroke="#e9ecff" stroke-opacity="0.6" stroke-width="1.2" />
  <path d="M26 30 C 29 25, 36 25, 39 30 C 37 35, 31 37, 26 34 C 27.6 33.2, 28.2 32.1, 26 30 Z" fill="#e9ecff" fill-opacity="0.78" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#e9ecff" stroke-opacity="0.14" />
</svg>
